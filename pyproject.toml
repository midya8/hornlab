[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hornlab"
version = "0.1.0"
description = "Bounded definite-Horn closure, models and minimal-support witnesses"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
hornlab = "hornlab.__main__:main"
[tool.setuptools]
packages = ["hornlab"]
